[package]
name = "new-tsdb"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
bincode = "1.3.3"
chrono = "0.4.41"
clap = { version = "4.5.37", features = ["derive"] }
config = "0.15.11"
dashmap = "6.1.0"
hyper = "1.6.0"
influxdb-line-protocol = "2.0.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
toml = "0.8.22"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tsdb-configdoc-derive = { path = "./tsdb-configdoc-derive" } 