# Sample Configuration for new TSDB

# The IP address or hostname the server should listen on (e.g. 127.0.0.1 or 0.0.0.0)
addr = "0.0.0.0"

# The port number on which the server should accept requests
#
# This is the public-facing port used by browsers or other apps to connect to your server.
# Make sure this port is not blocked by your system's firewall.
# Avoid using ports below 1024 unless your app runs as root (e.g. 80 or 443).
port = 3000

# Port used for SWIM gossip between nodes
gossip_port = 5000

# A unique identifier for this node in the cluster
node_id = "node-a"

# Addresses of other nodes for initial gossip discovery
#
# Provide a list of `host:port` strings for existing cluster members.
# SWIM will use these to bootstrap the mesh; once connected,
# membership updates are discovered dynamically.
bootstrap_peers = ["localhost:3001", "localhost:3002"]

# Directory where all data files (WAL, offsets, logs) are stored
#
# This folder will contain your write-ahead log, replication offsets,
# and any snapshots. Ensure the process has write permissions. (Default: "./tsdb")
data_dir = "./tsdb"

# Operation mode: standalone or replicaset
#
# Choose `standalone` for a single-node deployment with local WAL-based replication.
# Choose `replicaset` to run as a multi-node cluster using Raft for consensus.
# In `replicaset` mode, this node will use SWIM for peer discovery,
# then form or join a Raft group with the discovered members.
mode = "standalone"
